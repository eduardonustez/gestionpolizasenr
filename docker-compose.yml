name: gestion-polizas

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-polizas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-polizas}
      POSTGRES_USER: ${DB_USER:-polizas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-polizas}
      TZ: America/Bogota
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - polizas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polizas-data:
