server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gestion-polizas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polizas}
    username: ${DB_USER:polizas}
    password: ${DB_PASSWORD:polizas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

seguridad:
  api-key: ${API_KEY:123456}

polizas:
  ipc: ${IPC_VIGENTE:0.0520}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
